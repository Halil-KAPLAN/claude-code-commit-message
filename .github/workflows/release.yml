name: Build & Release

# Every push to main builds the extension. The version is bumped from the commit types
# since the last release (see .github/scripts/bump.js); when there is something to release,
# the bump is committed back to main, published to the stores and a GitHub Release is created.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check
        run: node --check extension.js

      - name: Decide version
        id: bump
        run: node .github/scripts/bump.js ${{ env.PUBLISH != 'true' && '--dry-run' || '' }}

      # Pushes made with GITHUB_TOKEN do not trigger another workflow run.
      - name: Commit version bump
        if: env.PUBLISH == 'true' && steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VSIX=claude-code-commit-message-$VERSION.vsix" >> "$GITHUB_ENV"
          npx -y @vscode/vsce package -o "claude-code-commit-message-$VERSION.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'

      # --skip-duplicate: a version that is already on the store is left alone.
      - name: Publish to VS Code Marketplace
        if: env.PUBLISH == 'true' && env.VSCE_PAT != ''
        run: npx -y @vscode/vsce publish --skip-duplicate --packagePath "$VSIX"

      - name: Publish to Open VSX
        if: env.PUBLISH == 'true' && env.OVSX_PAT != ''
        run: npx -y ovsx publish "$VSIX" -p "$OVSX_PAT" --skip-duplicate

      - name: Missing Marketplace token
        if: env.PUBLISH == 'true' && env.VSCE_PAT == ''
        run: echo "::warning::VSCE_PAT secret is not set, skipped publishing to the VS Code Marketplace."

      - name: GitHub Release
        if: env.PUBLISH == 'true' && steps.bump.outputs.release == 'true'
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "v$VERSION" "$VSIX" --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes-file notes.md
