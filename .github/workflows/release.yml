name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check
        run: node --check extension.js

      - name: Package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npx -y @vscode/vsce package -o "claude-code-commit-message-$VERSION.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        run: npx -y @vscode/vsce publish --skip-duplicate --packagePath "claude-code-commit-message-$VERSION.vsix"

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && env.OVSX_PAT != ''
        run: npx -y ovsx publish "claude-code-commit-message-$VERSION.vsix" -p "$OVSX_PAT" --skip-duplicate

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "claude-code-commit-message-$VERSION.vsix" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
